<html lang="es">
<head>
<meta charset="utf-8">

<title>Procesos geológicos · Temas 14 y 15</title>
<link rel="stylesheet" href="./estilo.css?v=19">

<a class="skip" href="#contenido">Saltar al contenido</a>
<header class="top"><a href="#inicio" class="brand">Cuaderno de Geología</a>
<div class="header-actions" id="barra-puntero">
<button type="button" id="activar-puntero" aria-label="Puntero" title="Puntero" aria-pressed="false"><span aria-hidden="true">◎</span></button>
<details class="settings"><summary>Ajustes</summary><div class="controls">
<div role="group" aria-label="Accesibilidad">
<div><label for="size">Letra</label><select id="size"><option value="100">Normal</option><option value="120">Grande</option><option value="145">Muy grande</option></select></div>
<label><input type="checkbox" id="contrast"> Alto contraste</label>
<div><label for="voice">Voz</label><select id="voice"><option value="">Automática · Google español o Mónica</option></select></div>
<div><label for="rate">Velocidad</label><select id="rate"><option value=".75">0,75×</option><option value=".9">0,9×</option><option selected value="1">1×</option><option value="1.15">1,15×</option></select></div>
</div>
<details class="pointer-options"><summary aria-label="Ajustes del puntero"><span aria-hidden="true">◎</span></summary>
<div id="ajustes-puntero" class="ajustes-puntero"></div></details>
</div></details></div></header>
<canvas id="capa-puntero" aria-hidden="true" hidden></canvas>
<div class="layout">
<nav aria-label="Navegación del tema"><a href="#inicio">Inicio</a><a href="#externos">Tema 14 · Externos</a><a href="#internos">Tema 15 · Internos</a><a href="#examen">Qué entra</a><a href="#retos">Actividades de examen</a><a href="#simulacro">Simulacro</a><a href="#serie">Ordenar la serie</a><a href="#practica">Autoevaluación</a><a href="#repaso">Repaso y progreso</a></nav>
<main id="contenido" tabindex="-1">
<div class="tools"><button id="speak" class="speaker" aria-pressed="false" aria-label="Leer pantalla en voz alta" title="Leer pantalla en voz alta"><span aria-hidden="true">🔊</span></button><button id="stop">Detener lectura</button><button id="print">Imprimir apuntes</button><span id="speech-status" role="status"></span></div>
<div id="screen"></div>
<div id="printout"></div>
<noscript>Activa JavaScript para abrir las explicaciones y realizar los ejercicios.</noscript>
</main>
</div>
</body>
